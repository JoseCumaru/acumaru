<!DOCTYPE html>
<html lang="pt-Br">

<head>
  <meta name="description" content="Acumaru - Exemplo de página de serviço com componentes modularizados">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exemplo - Acumaru Consultoria Ambiental</title>
  <link href="../css/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <!-- Header Component -->
  <div id="header-placeholder"></div>

  <!-- Conteúdo da página -->
  <section class="section">
    <div class="container">
      <h1>Título da Página de Serviço</h1>
      <p>Conteúdo específico do serviço...</p>
    </div>
  </section>

  <!-- WhatsApp Button Component -->
  <div id="whatsapp-placeholder"></div>

  <!-- Footer Component -->
  <div id="footer-placeholder"></div>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
  
  <!-- Ajuste os caminhos para uma pasta acima -->
  <script>
    // Função para carregar componentes HTML
    async function loadComponent(elementId, componentPath) {
      try {
        const response = await fetch(componentPath);
        if (!response.ok) {
          throw new Error(`Erro ao carregar ${componentPath}: ${response.status}`);
        }
        const html = await response.text();
        const element = document.getElementById(elementId);
        if (element) {
          element.innerHTML = html;
        }
      } catch (error) {
        console.error('Erro ao carregar componente:', error);
      }
    }

    // Carregar todos os componentes quando a página carregar
    document.addEventListener('DOMContentLoaded', async () => {
      // Carregar componentes (ajustado para páginas em subpastas)
      await loadComponent('header-placeholder', '../components/header.html');
      await loadComponent('footer-placeholder', '../components/footer.html');
      await loadComponent('whatsapp-placeholder', '../components/whatsapp-button.html');
      
      // Reinicializar ícones do Lucide após carregar os componentes
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }

      // Inicializar AOS
      if (typeof AOS !== 'undefined') {
        AOS.init({
          duration: 1000,
          once: false
        });
      }
    });
  </script>
  <script src="../js/script.js"></script>
</body>

</html>
